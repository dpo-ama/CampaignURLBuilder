<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign URL Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <link rel="stylesheet" href="./css/styles.css" />
    <script type="module" src="./js/app.js"></script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-xl p-8">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Campaign URL Builder</h1>
        <button
          id="clearButton"
          class="px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-semibold"
        >
          Clear All
        </button>
      </div>

      <p
        id="configError"
        role="alert"
        hidden
        class="mb-4 rounded border border-red-300 bg-red-50 p-3 text-red-800"
      ></p>

      <div class="space-y-4">
        <!-- What is the UTMs for? -->
        <div class="flex items-center gap-4">
          <label class="w-48 font-semibold text-gray-700"
            >What are the UTMs for?</label
          >
          <select
            id="utmPurpose"
            class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
            <option value="">Select Purpose</option>
          </select>
        </div>

        <!-- Vanity field -->
        <div
          id="vanityField"
          class="flex items-center gap-4"
          style="display: none"
        >
          <label class="w-48 font-semibold text-gray-700">Vanity</label>
          <input
            type="text"
            id="vanity"
            placeholder="Enter vanity name"
            class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <!-- Landing Page -->
        <div class="flex items-center gap-4">
          <label class="w-48 font-semibold text-gray-700">Landing Page</label>
          <input
            type="text"
            id="landingPage"
            placeholder="https://ama.ab.ca/page"
            class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <!-- Medium -->
        <div class="flex items-center gap-4">
          <label class="w-48 font-semibold text-gray-700">Medium</label>
          <select
            id="medium"
            class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
            <option value="">Select Medium</option>
          </select>
        </div>

        <!-- Source -->
        <div class="flex items-center gap-4">
          <label class="w-48 font-semibold text-gray-700">Source</label>
          <input
            type="text"
            id="sourceTextbox"
            placeholder="Enter source name"
            class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            style="display: none"
          />
          <select
            id="sourceDropdown"
            class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
            <option value="">Select Source</option>
          </select>
        </div>

        <!-- UTM Campaign Components (PPC Only) -->
        <div
          id="ppcSection"
          class="border-2 border-purple-200 rounded-lg p-6 bg-purple-50"
          style="display: none"
        >
          <h2 class="text-xl font-bold text-purple-800 mb-4">
            UTM Campaign Components
          </h2>
          <div class="space-y-4">
            <!-- Business Unit -->
            <div class="flex items-center gap-4">
              <label class="w-48 font-semibold text-gray-700"
                >Business Unit</label
              >
              <select
                id="businessUnit"
                class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              >
                <option value="">Select Business Unit</option>
              </select>
            </div>

            <!-- Product Name -->
            <div class="flex items-center gap-4">
              <label class="w-48 font-semibold text-gray-700"
                >Product Name</label
              >
              <input
                type="text"
                id="productName"
                placeholder="e.g., vrar, twhd, acq, hotel, tmi"
                class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              />
            </div>

            <!-- Platform -->
            <div class="flex items-center gap-4">
              <label class="w-48 font-semibold text-gray-700">Platform</label>
              <select
                id="platform"
                class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              >
                <option value="">Select Platform</option>
              </select>
            </div>

            <!-- Campaign Type -->
            <div class="flex items-center gap-4">
              <label class="w-48 font-semibold text-gray-700"
                >Campaign Type</label
              >
              <select
                id="campaignType"
                class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              >
                <option value="">Select Type</option>
              </select>
            </div>

            <!-- Campaign Targeting -->
            <div class="flex items-center gap-4">
              <label class="w-48 font-semibold text-gray-700">Targeting</label>
              <input
                type="text"
                id="targeting"
                placeholder="e.g., generic, demo, interest, lookalike"
                class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              />
            </div>

            <!-- Insertion Order Type (DV360 Only) -->
            <div
              id="dvInsertionOrderSection"
              class="flex items-center gap-4"
              style="display: none"
            >
              <label class="w-48 font-semibold text-gray-700">
                Insertion Order Type
              </label>

              <select
                id="dvInsertionOrder"
                class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-purple-500"
              >
                <option value="">Select Type</option>
              </select>
            </div>

            <!-- Insertion Order Targeting (DV360 Only) -->
            <div
              id="dvIOTargetingSection"
              class="flex items-center gap-4"
              style="display: none"
            >
              <label class="w-48 font-semibold text-gray-700">
                Insertion Order Targeting
              </label>
              <input
                type="text"
                id="ioTargeting"
                placeholder="e.g., generic, demo, interest, lookalike, remarketing"
                class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              />
            </div>

            <!-- Campaign Name (Auto-generated) -->
            <div class="flex items-center gap-4 mt-4">
              <label class="w-48 font-semibold text-gray-700">Campaign</label>
              <input
                type="text"
                id="campaignNamePPC"
                readonly
                class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded bg-gray-50"
              />
              <button
                id="copyCampaignButton"
                class="px-4 py-2 h-10 bg-blue-600 text-white rounded hover:bg-blue-700 flex items-center gap-2 whitespace-nowrap"
              >
                <span id="copyIcon">📋</span>
                <span id="copyText">Copy</span>
              </button>
            </div>

            <!-- Insertion Order Name Display Box (DV360 Only) -->
            <div id="ioDisplaySection" class="flex items-center gap-4 mt-4" style="display: none">
              <label class="w-48 font-semibold text-gray-700">Insertion Order</label>
              <input
                type="text"
                id="ioNameDisplay"
                readonly
                class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded bg-gray-50"
              />
              <button
                id="copyIOButton"
                class="px-4 py-2 h-10 bg-blue-600 text-white rounded hover:bg-blue-700 flex items-center gap-2 whitespace-nowrap"
              >
                <span id="copyIOIcon">📋</span>
                <span id="copyIOText">Copy</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Manual Campaign Name (Non-PPC) -->
        <div id="manualCampaignSection" class="flex items-center gap-4">
          <label class="w-48 font-semibold text-gray-700">Campaign</label>
          <input
            type="text"
            id="manualCampaignName"
            placeholder="utm_campaign=bu_campaignname"
            class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <!-- Content Name -->
        <div class="flex items-center gap-4">
          <label class="w-48 font-semibold text-gray-700">Content</label>
          <input
            type="text"
            id="contentName"
            placeholder="(optional) utm_content=creativesize, cta button"
            class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <!-- Marketing Tag -->
        <div class="flex items-center gap-4">
          <label class="w-48 font-semibold text-gray-700">Marketing Tag</label>
          <input
            type="text"
            id="marketingTag"
            placeholder="bu_campaignname"
            class="flex-1 h-10 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <p
          id="urlError"
          role="alert"
          hidden
          class="rounded border border-red-300 bg-red-50 p-3 text-red-800"
        ></p>

        <!-- Final URL -->
        <div class="flex items-start gap-4 bg-green-50 p-4 rounded">
          <label class="w-48 font-semibold text-gray-700 pt-2">Final URL</label>
          <textarea
            id="finalURL"
            readonly
            rows="3"
            class="flex-1 px-3 py-2 border border-gray-300 rounded bg-gray-50 resize-none"
          ></textarea>
          <button
            id="copyURLButton"
            class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 flex items-center gap-2 whitespace-nowrap"
          >
            <span id="copyURLIcon">📋</span>
            <span id="copyURLText">Copy</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
